name: Trusted workspace and account checkpoint
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies only on the runner
        run: bash scripts/ci/run-audit-check.sh trusted-actions-install npm ci --no-audit
      - name: Scoped OTP, Passkey and cancellation transitions (synthetic only)
        run: bash scripts/ci/run-audit-check.sh trusted-actions-flow node --test tests/trustedVerification.test.ts tests/trustedPasskey.test.ts tests/workspaceState.test.ts
      - name: Existing UI compatibility
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh trusted-actions-compat npm test
      - name: Typed system UI build
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh trusted-actions-build npm run build:system
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trusted-actions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
