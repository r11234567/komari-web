name: Native OTP account checkpoint
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-otp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install only on the Actions runner
        run: bash scripts/ci/run-audit-check.sh native-otp-install npm ci --no-audit
      - name: Private contact canonicalization and authorization targets
        run: bash scripts/ci/run-audit-check.sh native-otp-targets node --test tests/nativeContacts.test.ts
      - name: Existing account, workspace and plugin regressions
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh native-otp-regression npm test
      - name: Typecheck and compile native account UI
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh native-otp-build npm run build:system
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-otp-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
