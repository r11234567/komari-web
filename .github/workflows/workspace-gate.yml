name: Workspace UI authorization checkpoint
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: bash scripts/ci/run-audit-check.sh install npm ci --no-audit
      - name: Workspace deadlines, cancellation, scope and account replacement
        run: bash scripts/ci/run-audit-check.sh workspace node --test tests/workspaceState.test.ts
      - name: Install pinned component DOM on CI only
        run: bash scripts/ci/run-audit-check.sh workspace-dom npm install --no-save --package-lock=false --ignore-scripts --no-audit jsdom@26.1.0
      - name: Actual file-only unlock portal, themed OTP and shared live metrics
        run: bash scripts/ci/run-audit-check.sh workspace-components node --import ./tests/workspace-ui/setup.mjs --import ./tests/workspace-ui/register.mjs --test --test-reporter=tap tests/workspace-ui/components.test.ts
      - name: Require observed component passes without skips
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh workspace-evidence python3 scripts/ci/check-workspace-components.py
      - name: Missing portal and missing live provider must fail real components
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh workspace-negative bash scripts/ci/test-workspace-components-negative.sh
      - name: Typecheck Connect integration
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh types node node_modules/typescript/bin/tsc -b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
