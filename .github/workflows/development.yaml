name: Validate Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Reject legacy transports in default theme
        run: |
          set -euo pipefail
          matches=$(find dist -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) \
            ! -name 'bundle-analysis.html' -print0 \
            | xargs -0 grep -IlE 'rpc2|jsonrpc|/api/rpc|new WebSocket' || true)
          if [ -n "$matches" ]; then
            echo "Legacy transport references found in published files:"
            echo "$matches"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
