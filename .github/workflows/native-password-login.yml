name: Native password and OTP login checkpoint
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  password-login:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies only on the hosted runner
        run: bash scripts/ci/run-audit-check.sh password-login-install npm ci --no-audit
      - name: Password, OTP and cancellation transitions (synthetic only)
        run: bash scripts/ci/run-audit-check.sh password-login-flow node --test tests/nativePasswordLogin.test.ts tests/passwordLoginHandoff.test.ts tests/otpInput.test.ts tests/trustedVerification.test.ts tests/trustedPasskey.test.ts
      - name: Existing login, OAuth, Passkey and workspace regression coverage
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh password-login-compat npm test
      - name: Typed system UI build
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh password-login-build npm run build:system
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-password-login-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
