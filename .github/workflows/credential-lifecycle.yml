name: Credential lifecycle Web stage
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credential-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash scripts/ci/run-audit-check.sh credential-install npm ci --no-audit
      - name: Install pinned CI-only DOM environment without E2E
        run: bash scripts/ci/run-audit-check.sh credential-dom npm install --no-save --package-lock=false --ignore-scripts --no-audit jsdom@26.1.0
      - name: Real component save, verification scope, selected machine and no polling
        run: bash scripts/ci/run-audit-check.sh credential-components node --import ./tests/credential/register.mjs --test --test-reporter=tap tests/credential/components.test.ts
      - name: Require observed non-skipped component assertions
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-evidence python3 scripts/ci/check-credential-lifecycle.py
      - name: Prove missing authorization header fails the actual component test
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-negative bash scripts/ci/test-credential-negative.sh
      - name: Compile actual application and preserve all type errors
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-build npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
          if-no-files-found: error
